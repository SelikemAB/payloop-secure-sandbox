# Unprivileged nginx in front of php-fpm. Terminate TLS at your real edge; this file is for the container hop.
worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 512; }
http {
  server_tokens off;
  client_max_body_size 64k;
  client_body_timeout 10s;
  limit_req_zone $binary_remote_addr zone=perip:10m rate=10r/s;
  access_log /dev/stdout;
  error_log  /dev/stderr warn;
  client_body_temp_path /tmp/cb; proxy_temp_path /tmp/pt; fastcgi_temp_path /tmp/ft; uwsgi_temp_path /tmp/ut; scgi_temp_path /tmp/st;

  server {
    listen 8080;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    # Add Strict-Transport-Security at the TLS-terminating edge.

    location / {
      limit_req zone=perip burst=20 nodelay;
      include fastcgi_params;                       # REMOTE_ADDR is the client address nginx sees
      fastcgi_param SCRIPT_FILENAME /srv/payloop/public/index.php;
      fastcgi_param SCRIPT_NAME /index.php;
      fastcgi_pass app:9000;
      fastcgi_read_timeout 10s;
    }
  }
}
