# Local runtime for the pipeline demo. Requires PAYLOOP_TOKEN_SECRET (>= 32 chars) in the environment or a .env file.
services:
  app:
    build: .
    image: payloop:local
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      PAYLOOP_TOKEN_SECRET: ${PAYLOOP_TOKEN_SECRET:?set PAYLOOP_TOKEN_SECRET (32+ chars) in .env}
      PAYLOOP_DB: /srv/payloop/var/payloop.sqlite
      PAYLOOP_LOG: /srv/payloop/var/log/payloop.jsonl
      PAYLOOP_WEBHOOK_ALLOWLIST: ${PAYLOOP_WEBHOOK_ALLOWLIST:-}
    volumes: ["payloop-data:/srv/payloop/var"]
    restart: unless-stopped
  init:
    image: payloop:local
    profiles: ["init"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      PAYLOOP_DB: /srv/payloop/var/payloop.sqlite
    volumes: ["payloop-data:/srv/payloop/var"]
    command: ["php", "db/seed.php"]
  proxy:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports: ["127.0.0.1:8080:8080"]
    volumes: ["./docker/nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on: [app]
    restart: unless-stopped
volumes:
  payloop-data:
